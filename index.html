<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TouchDesigner POV камер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: one full-screen operator network; caption floats on top, controls sit on the bottom edge like a timeline bar. */
:root {
  color-scheme: dark;
  --pane: #0e0e14;        /* network background */
  --panel: #17171f;       /* bars and buttons */
  --edge: #34343f;        /* borders, wires */
  --text: #f1f1f4;
  --muted: #8c8c9a;
  --lime: #9bff1e;        /* threshold operator */
  --blue: #2f55ff;        /* lookup operator */
  --font-display: "Unbounded", "Trebuchet MS", "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--pane);
  color: var(--text);
  font-family: var(--font-mono);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#caption {
  position: fixed; top: 0; left: 0; right: 0;
  padding: 18px 16px 0;
  text-align: center;
  pointer-events: none;
}
#caption span {
  display: inline-block;
  pointer-events: auto;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(15px, 4.4vw, 26px);
  line-height: 1.35;
  text-wrap: balance;
  max-width: 22ch;
  padding: 2px 8px;
  border-radius: 6px;
  outline: none;
  -webkit-user-select: text; user-select: text;
  cursor: text;
}
#caption span:focus-visible { box-shadow: 0 0 0 2px var(--lime); }
#bar {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column; gap: 8px;
  padding: 10px 16px 14px;
  background: linear-gradient(to top, rgba(14,14,20,.96) 70%, rgba(14,14,20,0));
}
#btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
button, .filebtn {
  font: 600 13px/1 var(--font-mono);
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 6px;
  padding: 11px 14px;
  cursor: pointer;
}
button.primary { background: var(--lime); color: #0b1400; border-color: var(--lime); }
button:focus-visible, .filebtn:focus-within { outline: 2px solid var(--lime); outline-offset: 2px; }
button[hidden] { display: none; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }
#msg {
  margin: 0; text-align: center;
  font-size: 11.5px; line-height: 1.45; color: var(--muted);
  min-height: 1.45em;
}
#msg.warn { color: #ffd166; }
video { display: none; }
</style>
</head>
<body>
<canvas id="stage" aria-label="Камерын дүрсийг TouchDesigner маягийн сүлжээгээр харуулах талбар"></canvas>

<div id="caption"><span id="captionText" contenteditable="true" spellcheck="false" role="textbox" aria-label="Гарчиг">POV: чи TouchDesigner дотор амьдардаг</span></div>

<div id="bar">
  <div id="btns">
    <button id="camBtn" class="primary" type="button">Камер асаах</button>
    <button id="flipBtn" type="button" hidden>Камер солих</button>
    <button id="resetBtn" type="button">Дахин эхлэх</button>
    <label class="filebtn">Видео сонгох<input id="fileIn" type="file" accept="video/*"></label>
  </div>
  <p id="msg">Жишээ дүрс тоглож байна. Цонхыг чирж зөөнө, баруун талын цэгээс утас татаж холбоно, хоёр хуруугаар томруулна.</p>
</div>

<video id="vid" playsinline muted loop></video>

<script>
(function () {
  "use strict";
  var VISION = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
  var WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
  var MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

  var SW = 160, SH = 120, N = SW * SH;            // working frame; 4:3 on wide screens, 3:4 on phones
  var stage = document.getElementById("stage");
  var ctx = stage.getContext("2d");
  var video = document.getElementById("vid");
  var camBtn = document.getElementById("camBtn");
  var flipBtn = document.getElementById("flipBtn");
  var resetBtn = document.getElementById("resetBtn");
  var fileIn = document.getElementById("fileIn");
  var msgEl = document.getElementById("msg");
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var work = document.createElement("canvas");
  var wctx = work.getContext("2d", { willReadFrequently: true });
  function makeBuf() { var c = document.createElement("canvas"); return { c: c, x: c.getContext("2d"), img: null }; }
  var bufGray = makeBuf(), bufLime = makeBuf(), bufBlue = makeBuf();
  var luma = new Float32Array(N);
  var lo = 0, hi = 1;

  function setWork(w, h) {
    SW = w; SH = h; N = w * h;
    work.width = w; work.height = h;
    [bufGray, bufLime, bufBlue].forEach(function (b) { b.c.width = w; b.c.height = h; b.img = b.x.createImageData(w, h); });
    luma = new Float32Array(N);
  }

  var mode = "demo";          // demo | cam | file
  var facing = "user", mirror = false, stream = null, fileUrl = null;
  var W = 0, H = 0, dpr = 1, portrait = null;

  // Operators. Names follow TouchDesigner's default TOP names.
  var nodes = [
    { id: "in",   label: "videodevicein1", src: work,      input: null },
    { id: "gray", label: "monochrome1",    src: bufGray.c, input: null },
    { id: "lime", label: "threshold1",     src: bufLime.c, input: null },
    { id: "blue", label: "lookup1",        src: bufBlue.c, input: null },
    { id: "out",  label: "out1",           src: null,      input: null, big: true }
  ];
  var byId = {}; nodes.forEach(function (n) { byId[n.id] = n; n.x = n.y = n.w = n.h = 0; });
  var userMoved = false;

  function say(text, warn) { msgEl.textContent = text; msgEl.className = warn ? "warn" : ""; }

  /* ---------- layout ---------- */
  function place(id, x, y, w) { var n = byId[id]; n.x = x; n.y = y; n.w = w; n.h = w * SH / SW; }
  function layout() {
    var top = Math.min(120, H * 0.17), bottom = H - 118, avail = Math.max(160, bottom - top), ar = SH / SW;
    var tw = Math.min(W * 0.19, avail * 0.24 / ar);
    place("in",   W * 0.05, top + avail * 0.33, tw);
    place("gray", W * 0.32, top + avail * 0.05, tw);
    place("blue", W * 0.32, top + avail * 0.33, tw);
    place("lime", W * 0.32, top + avail * 0.61, tw);
    place("out",  W * 0.64, top + avail * 0.28, Math.min(tw * 1.5, W * 0.31));
  }
  function resetGraph() {
    byId.gray.input = "in"; byId.lime.input = "in"; byId.blue.input = "in"; byId.out.input = null;
    grabs = {}; userMoved = false; layout();
  }

  function resize() {
    var oldW = W, oldH = H;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    stage.width = Math.round(W * dpr); stage.height = Math.round(H * dpr);
    var p = W < H;
    if (p !== portrait) {
      portrait = p;
      if (p) setWork(120, 160); else setWork(160, 120);
      layout();
    } else if (!userMoved) {
      layout();
    } else {
      nodes.forEach(function (n) {
        n.x = Math.max(0, Math.min(W - n.w, n.x * W / oldW));
        n.y = Math.max(0, Math.min(H - n.h, n.y * H / oldH));
      });
    }
  }
  window.addEventListener("resize", resize);

  /* ---------- sources ---------- */
  function drawDemo(t) {
    var s = reduceMotion ? 1.2 : t / 1000, u = SW / 160, cx = SW / 2, base = SH;
    wctx.fillStyle = "#050508"; wctx.fillRect(0, 0, SW, SH);
    function blob(x, y, rx, ry, v) {
      var g = wctx.createRadialGradient(x, y - ry * 0.2, 1, x, y, Math.max(rx, ry));
      var d = v * 0.45 | 0;
      g.addColorStop(0, "rgb(" + v + "," + v + "," + v + ")");
      g.addColorStop(0.75, "rgb(" + d + "," + d + "," + d + ")");
      g.addColorStop(1, "rgba(0,0,0,0)");
      wctx.fillStyle = g; wctx.beginPath(); wctx.ellipse(x, y, rx, ry, 0, 0, 6.2832); wctx.fill();
    }
    var k = Math.max(u, 0.9), sway = Math.sin(s * 0.9) * 5;
    blob(cx + sway, base - 8 * k, 46 * k, 44 * k, 150);
    blob(cx + sway * 1.3, base - 68 * k + Math.sin(s * 1.7) * 2, 20 * k, 25 * k, 235);
    blob(cx + 44 * k + Math.sin(s * 2.3) * 8, base - 74 * k + Math.cos(s * 1.9) * 16, 11 * k, 14 * k, 250);
    blob(cx - 44 * k + Math.cos(s * 1.4) * 6, base - 50 * k + Math.sin(s * 2.1) * 20, 10 * k, 13 * k, 240);
  }

  function grab(t) {
    if (mode !== "demo" && video.readyState >= 2 && video.videoWidth) {
      var vw = video.videoWidth, vh = video.videoHeight;
      var s = Math.max(SW / vw, SH / vh), dw = vw * s, dh = vh * s;
      wctx.save();
      if (mirror) { wctx.translate(SW, 0); wctx.scale(-1, 1); }
      wctx.drawImage(video, (SW - dw) / 2, (SH - dh) / 2, dw, dh);
      wctx.restore();
    } else {
      drawDemo(t);
    }
  }

  function stopStream() {
    if (stream) { stream.getTracks().forEach(function (tr) { tr.stop(); }); stream = null; }
  }

  var HAND_HELP = "Гараа камерт харуулаад эрхий, долоовор хуруугаа чимхэнэ. Цонхыг чимхэж зөөнө, баруун талын цэгээс утас татна, хоёр гараар чимхэж томруулна.";

  function startCam() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      say("Энэ хөтөч камер нээж чадахгүй байна. Видео сонгох товчоор бичлэгээ оруулна уу.", true);
      return;
    }
    stopStream();
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false
    }).then(function (st) {
      stream = st;
      if (fileUrl) { URL.revokeObjectURL(fileUrl); fileUrl = null; }
      video.removeAttribute("src");
      video.srcObject = st;
      mirror = facing === "user";
      mode = "cam";
      camBtn.textContent = "Камер унтраах"; camBtn.classList.remove("primary");
      flipBtn.hidden = false;
      say("Камер ажиллаж байна.");
      loadHands();
      return video.play();
    }).catch(function (err) {
      var denied = err && (err.name === "NotAllowedError" || err.name === "SecurityError");
      say(denied
        ? "Камерын зөвшөөрөл олгогдсонгүй. Хөтчийн хаягийн мөрөн дэх камерын тэмдгээр зөвшөөрөөд дахин оролдоно уу, эсвэл видео сонгоно уу."
        : "Камер нээгдсэнгүй. Өөр програм ашиглаж байгаа эсэхийг шалгаад дахин оролдоно уу, эсвэл видео сонгоно уу.", true);
    });
  }

  function stopCam() {
    stopStream(); video.srcObject = null; mode = "demo"; clearHands();
    camBtn.textContent = "Камер асаах"; camBtn.classList.add("primary");
    flipBtn.hidden = true;
    say("Жишээ дүрс тоглож байна.");
  }

  camBtn.addEventListener("click", function () { if (mode === "cam") stopCam(); else startCam(); });
  flipBtn.addEventListener("click", function () { facing = facing === "user" ? "environment" : "user"; clearHands(); startCam(); });
  resetBtn.addEventListener("click", resetGraph);

  fileIn.addEventListener("change", function () {
    var f = fileIn.files && fileIn.files[0];
    if (!f) return;
    stopStream(); video.srcObject = null; clearHands();
    if (fileUrl) URL.revokeObjectURL(fileUrl);
    fileUrl = URL.createObjectURL(f);
    video.src = fileUrl; video.loop = true; video.muted = true;
    mirror = false; mode = "file";
    camBtn.textContent = "Камер асаах"; camBtn.classList.add("primary");
    flipBtn.hidden = true;
    var p = video.play();
    if (p && p.catch) p.catch(function () {
      say("Энэ видеог тоглуулж чадсангүй. MP4 форматтай өөр бичлэг сонгоно уу.", true);
    });
    say("Таны видео тоглож байна.");
    loadHands();
    fileIn.value = "";
  });
  video.addEventListener("error", function () {
    if (mode === "file") { mode = "demo"; say("Энэ видеог уншиж чадсангүй. MP4 форматтай өөр бичлэг сонгоно уу.", true); }
  });

  /* ---------- hand tracking (MediaPipe Hand Landmarker) ---------- */
  var landmarker = null, handsState = "idle", hands = {}, lastVT = -1;
  function loadHands() {
    if (handsState !== "idle") { if (handsState === "ready") say(HAND_HELP); return; }
    handsState = "loading";
    say("Гар таних загвар ачаалж байна…");
    import(VISION).then(function (m) {
      return m.FilesetResolver.forVisionTasks(WASM).then(function (fs) {
        var opts = function (d) {
          return { baseOptions: { modelAssetPath: MODEL, delegate: d }, runningMode: "VIDEO", numHands: 2 };
        };
        return m.HandLandmarker.createFromOptions(fs, opts("GPU")).catch(function () {
          return m.HandLandmarker.createFromOptions(fs, opts("CPU"));
        });
      });
    }).then(function (hl) {
      landmarker = hl; handsState = "ready";
      if (mode !== "demo") say(HAND_HELP);
    }).catch(function () {
      handsState = "failed";
      say("Гар таних загвар ачаалагдсангүй. Интернэтээ шалгаад хуудсаа дахин ачаална уу. Хуруу, хулганаар чирж болно.", true);
    });
  }
  function clearHands() {
    Object.keys(hands).forEach(function (id) { if (hands[id].pinch) grabEnd(id); });
    hands = {};
  }
  function toStage(nx, ny) {
    var vw = video.videoWidth, vh = video.videoHeight;
    var s = Math.max(SW / vw, SH / vh);
    var wx = (SW - vw * s) / 2 + nx * vw * s, wy = (SH - vh * s) / 2 + ny * vh * s;
    if (mirror) wx = SW - wx;
    var s2 = Math.max(W / SW, H / SH);
    return { x: (W - SW * s2) / 2 + wx * s2, y: (H - SH * s2) / 2 + wy * s2 };
  }
  function trackHands() {
    if (!landmarker || mode === "demo" || video.readyState < 2 || !video.videoWidth) return;
    if (video.currentTime === lastVT) return;
    lastVT = video.currentTime;
    var res;
    try { res = landmarker.detectForVideo(video, performance.now()); } catch (e) { return; }
    var lms = (res && res.landmarks) || [], hd = (res && (res.handedness || res.handednesses)) || [];
    var vw = video.videoWidth, vh = video.videoHeight, seen = {};
    for (var i = 0; i < lms.length; i++) {
      var lm = lms[i];
      var id = "hand" + ((hd[i] && hd[i][0] && hd[i][0].categoryName) || i);
      if (seen[id]) id += "_" + i;
      seen[id] = true;
      var a = lm[4], b = lm[8];
      var pd = Math.hypot((a.x - b.x) * vw, (a.y - b.y) * vh);
      var size = Math.hypot((lm[0].x - lm[9].x) * vw, (lm[0].y - lm[9].y) * vh) || 1;
      var ratio = pd / size;
      var pos = toStage((a.x + b.x) / 2, (a.y + b.y) / 2);
      var h = hands[id];
      if (!h) h = hands[id] = { x: pos.x, y: pos.y, pinch: false, miss: 0 };
      h.x += (pos.x - h.x) * 0.55; h.y += (pos.y - h.y) * 0.55; h.miss = 0;
      var was = h.pinch;
      if (!was && ratio < 0.3) h.pinch = true; else if (was && ratio > 0.5) h.pinch = false;
      if (h.pinch && !was) grabStart(id, h.x, h.y, 30);
      else if (h.pinch) grabMove(id, h.x, h.y);
      else if (was) grabEnd(id);
    }
    Object.keys(hands).forEach(function (id) {
      if (seen[id]) return;
      var h = hands[id];
      if (++h.miss > 6) { if (h.pinch) grabEnd(id); delete hands[id]; }
    });
  }

  /* ---------- per-frame image processing ---------- */
  function process() {
    var d = wctx.getImageData(0, 0, SW, SH).data;
    var g = bufGray.img.data, l = bufLime.img.data, b = bufBlue.img.data;
    var mn = 1, mx = 0, i, p, v, k, q;
    for (i = 0, p = 0; i < N; i++, p += 4) {
      v = (d[p] * 0.299 + d[p + 1] * 0.587 + d[p + 2] * 0.114) / 255;
      if (v < mn) mn = v; if (v > mx) mx = v;
      luma[i] = v;
    }
    lo += (mn - lo) * 0.08; hi += (Math.max(mx, mn + 0.15) - hi) * 0.08;   // slow auto-levels
    var span = Math.max(0.15, hi - lo);
    for (i = 0, p = 0; i < N; i++, p += 4) {
      v = (luma[i] - lo) / span; if (v < 0) v = 0; else if (v > 1) v = 1;
      luma[i] = v;

      q = v * 255 | 0;                                   // monochrome
      g[p] = q; g[p + 1] = q; g[p + 2] = q; g[p + 3] = 255;

      k = (v - 0.3) / 0.14; if (k < 0) k = 0; else if (k > 1) k = 1;     // threshold: subject black on lime
      k = 1 - k;
      l[p] = 155 * k; l[p + 1] = 255 * k; l[p + 2] = 30 * k; l[p + 3] = 255;

      if (v < 0.6) {                                     // lookup: navy -> blue -> pale
        k = v / 0.6;
        b[p] = 10 + 30 * k; b[p + 1] = 6 + 64 * k; b[p + 2] = 46 + 209 * k;
      } else {
        k = (v - 0.6) / 0.4;
        b[p] = 40 + 150 * k; b[p + 1] = 70 + 145 * k; b[p + 2] = 255;
      }
      b[p + 3] = 255;
    }
    bufGray.x.putImageData(bufGray.img, 0, 0);
    bufLime.x.putImageData(bufLime.img, 0, 0);
    bufBlue.x.putImageData(bufBlue.img, 0, 0);
  }

  /* ---------- graph ---------- */
  function isLit(n) {
    for (var i = 0; n && i < 8; i++) { if (n.id === "in") return true; n = n.input ? byId[n.input] : null; }
    return false;
  }
  function outPort(n) { return { x: n.x + n.w + 3, y: n.y + n.h / 2 }; }
  function inPort(n) { return { x: n.x - 3, y: n.y + n.h / 2 }; }
  function hitPort(x, y, r) {
    for (var i = nodes.length - 1; i >= 0; i--) {
      var n = nodes[i]; if (n.big) continue;
      var p = outPort(n);
      if (Math.hypot(x - p.x, y - p.y) <= r) return n;
    }
    return null;
  }
  function hitNode(x, y, pad) {
    for (var i = nodes.length - 1; i >= 0; i--) {
      var n = nodes[i];
      if (x >= n.x - pad && x <= n.x + n.w + pad && y >= n.y - pad && y <= n.y + n.h + pad) return n;
    }
    return null;
  }
  function toFront(n) { var i = nodes.indexOf(n); if (i >= 0) { nodes.splice(i, 1); nodes.push(n); } }
  function feeds(a, b) {            // does a sit downstream of b?
    for (var i = 0; a && i < 8; i++) { if (a === b) return true; a = a.input ? byId[a.input] : null; }
    return false;
  }

  /* ---------- grabbing: shared by mouse, touch and pinching hands ---------- */
  var grabs = {};
  function otherDrag(pid, n) {
    for (var k in grabs) if (k !== String(pid) && grabs[k].type === "drag" && grabs[k].n === n) return grabs[k];
    return null;
  }
  function grabStart(pid, x, y, r) {
    var p = hitPort(x, y, r);
    if (p) { grabs[pid] = { type: "wire", n: p, x: x, y: y }; return true; }
    var n = hitNode(x, y, r * 0.5);
    if (!n) return false;
    toFront(n);
    var g = grabs[pid] = { type: "drag", n: n, dx: x - n.x, dy: y - n.y, x: x, y: y };
    var o = otherDrag(pid, n);
    if (o) n.scale = { d0: Math.max(20, Math.hypot(g.x - o.x, g.y - o.y)), w0: n.w };
    return true;
  }
  function grabMove(pid, x, y) {
    var g = grabs[pid]; if (!g) return;
    g.x = x; g.y = y;
    if (g.type !== "drag") return;
    var n = g.n, o = otherDrag(pid, n);
    userMoved = true;
    if (o && n.scale) {
      var w = n.scale.w0 * Math.hypot(g.x - o.x, g.y - o.y) / n.scale.d0;
      w = Math.max(48, Math.min(W * 0.96, w));
      n.w = w; n.h = w * SH / SW;
      n.x = (g.x + o.x) / 2 - n.w / 2; n.y = (g.y + o.y) / 2 - n.h / 2;
    } else {
      n.x = Math.max(-n.w * 0.5, Math.min(W - n.w * 0.5, x - g.dx));
      n.y = Math.max(0, Math.min(H - n.h * 0.5, y - g.dy));
    }
  }
  function grabEnd(pid) {
    var g = grabs[pid]; if (!g) return;
    delete grabs[pid];
    if (g.type === "wire") {
      var t = hitNode(g.x, g.y, 14);
      if (t && t !== g.n && t.id !== "in" && !feeds(g.n, t)) t.input = g.n.id;
      return;
    }
    var o = otherDrag(pid, g.n);
    g.n.scale = null;
    if (o) { o.dx = o.x - g.n.x; o.dy = o.y - g.n.y; }
  }

  stage.addEventListener("pointerdown", function (e) {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (grabStart("p" + e.pointerId, e.clientX, e.clientY, 16)) {
      try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });
  stage.addEventListener("pointermove", function (e) { grabMove("p" + e.pointerId, e.clientX, e.clientY); });
  stage.addEventListener("pointerup", function (e) { grabEnd("p" + e.pointerId); });
  stage.addEventListener("pointercancel", function (e) { grabEnd("p" + e.pointerId); });
  stage.addEventListener("wheel", function (e) {
    var n = hitNode(e.clientX, e.clientY, 0); if (!n) return;
    e.preventDefault();
    var cx = n.x + n.w / 2, cy = n.y + n.h / 2;
    var w = Math.max(48, Math.min(W * 0.96, n.w * (e.deltaY < 0 ? 1.08 : 0.926)));
    n.w = w; n.h = w * SH / SW; n.x = cx - n.w / 2; n.y = cy - n.h / 2; userMoved = true;
  }, { passive: false });

  /* ---------- drawing ---------- */
  function ghost() {
    // Subject as displaced horizontal lines across the whole pane, three offset colour passes.
    var s = Math.max(W / SW, H / SH), ox = (W - SW * s) / 2, oy = (H - SH * s) / 2;
    var amp = s * 5, passes = [[-1.5, "rgba(255,70,130,0.30)"], [0, "rgba(130,255,170,0.24)"], [1.5, "rgba(90,140,255,0.36)"]];
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.lineWidth = 1;
    for (var c = 0; c < 3; c++) {
      var dx = passes[c][0];
      ctx.strokeStyle = passes[c][1];
      ctx.beginPath();
      for (var j = 0; j < SH; j++) {
        var row = j * SW, pen = false, by = oy + (j + 0.5) * s + dx * 0.6;
        if (by < -amp || by > H + amp) continue;
        for (var i = 0; i < SW; i += 2) {
          var v = luma[row + i];
          if (v < 0.14) { pen = false; continue; }
          var px = ox + i * s + dx, py = by - v * amp;
          if (pen) ctx.lineTo(px, py); else { ctx.moveTo(px, py); pen = true; }
        }
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function curve(x1, y1, x2, y2, color, width) {
    var k = Math.max(30, Math.abs(x2 - x1) * 0.5);
    ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.bezierCurveTo(x1 + k, y1, x2 - k, y2, x2, y2);
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
  }

  function drawNode(n) {
    var lit = isLit(n), src = lit ? (n.big ? byId[n.input].src : n.src) : null;
    var held = false; for (var k in grabs) if (grabs[k].n === n && grabs[k].type === "drag") held = true;
    ctx.fillStyle = "#07070b"; ctx.fillRect(n.x - 3, n.y - 3, n.w + 6, n.h + 6);
    if (src) {
      ctx.drawImage(src, n.x, n.y, n.w, n.h);
      if (n.w > 150) {                                             // scanlines on enlarged viewers
        ctx.fillStyle = "rgba(0,0,8,0.36)";
        for (var y = n.y; y < n.y + n.h; y += 3) ctx.fillRect(n.x, y, n.w, 1);
      }
    }
    ctx.strokeStyle = held ? "#ffffff" : (n.big ? "#c9c9d2" : (lit ? "#4f8a3a" : "#4a4a58"));
    ctx.lineWidth = held || n.big ? 2 : 1;
    ctx.strokeRect(n.x - 3, n.y - 3, n.w + 6, n.h + 6);
    ctx.fillStyle = lit ? "#b9b9c4" : "#74748a";
    ctx.font = "9.5px ui-monospace, Menlo, Consolas, monospace";
    ctx.textBaseline = "top";
    ctx.fillText(n.label, n.x - 3, n.y + n.h + 7);
    var p;
    if (!n.big) { p = outPort(n); ctx.fillStyle = "#f1f1f4"; ctx.beginPath(); ctx.arc(p.x, p.y, 4.5, 0, 6.2832); ctx.fill(); }
    if (n.id !== "in") { p = inPort(n); ctx.fillStyle = "#8c8c9a"; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 6.2832); ctx.fill(); }
  }

  function drawHands() {
    Object.keys(hands).forEach(function (id) {
      var h = hands[id], r = h.pinch ? 9 : 13;
      ctx.lineWidth = 2;
      ctx.strokeStyle = h.pinch ? "#ff8ad8" : "rgba(255,255,255,0.9)";
      ctx.beginPath(); ctx.arc(h.x, h.y, r, 0, 6.2832); ctx.stroke();
      if (h.pinch) {
        ctx.strokeStyle = "rgba(255,138,216,0.45)";
        ctx.beginPath(); ctx.arc(h.x, h.y, r + 12, 0, 6.2832); ctx.stroke();
        ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(h.x, h.y, 3, 0, 6.2832); ctx.fill();
      }
    });
  }

  var frames = 0, fps = 60, lastFps = 0, frameNo = 0;
  function draw(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#0e0e14"; ctx.fillRect(0, 0, W, H);
    ghost();
    nodes.forEach(function (n) {
      if (!n.input) return;
      var a = outPort(byId[n.input]), b = inPort(n), lit = isLit(n);
      curve(a.x, a.y, b.x, b.y, lit ? "rgba(214,214,222,0.7)" : "rgba(140,140,154,0.5)", lit ? 1.3 : 1);
    });
    nodes.forEach(drawNode);
    for (var k in grabs) {
      var g = grabs[k];
      if (g.type === "wire") { var a = outPort(g.n); curve(a.x, a.y, g.x, g.y, "#ff8ad8", 2); }
    }
    drawHands();

    // timeline readout, as in the bottom bar of the TouchDesigner editor
    var sec = t / 1000, mm = Math.floor(sec / 60), ss = Math.floor(sec % 60), ff = Math.floor((sec % 1) * 60);
    function z(n) { return (n < 10 ? "0" : "") + n; }
    ctx.fillStyle = "#6c6c7a"; ctx.font = "10px ui-monospace, Menlo, Consolas, monospace"; ctx.textBaseline = "bottom";
    ctx.fillText("00:" + z(mm) + ":" + z(ss) + "." + z(ff) + "   f " + frameNo + "   " + fps + " fps", 16, H - 104);
  }

  function loop(t) {
    requestAnimationFrame(loop);
    frames++; frameNo = (frameNo + 1) % 600;
    if (t - lastFps > 1000) { fps = Math.round(frames * 1000 / (t - lastFps)); frames = 0; lastFps = t; }
    grab(t); process(); trackHands(); draw(t);
  }

  document.getElementById("captionText").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); e.target.blur(); }
  });

  resize();
  resetGraph();
  requestAnimationFrame(loop);
  // Ask for the camera as soon as the page opens (not inside an embedding frame, where it is blocked).
  var framed = false; try { framed = window.top !== window.self; } catch (e) { framed = true; }
  if (!framed && location.protocol === "https:" && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) startCam();
})();
</script>
</body>
</html>
